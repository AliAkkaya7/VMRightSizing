# The only manual step: oc apply -f bootstrap/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vm-rightsizing
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/AliAkkaya7/VMRightSizing.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
