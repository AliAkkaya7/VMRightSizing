apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-receiver
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/AliAkkaya7/VMRightSizing.git
    targetRevision: main
    path: manifests/04-metrics-receiver
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
