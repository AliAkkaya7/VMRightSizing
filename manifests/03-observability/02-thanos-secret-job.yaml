# Builds Secret "thanos-object-storage" from the bucket credentials generated by the ObjectBucketClaim.
# (Credentials are generated in-cluster, so they cannot be stored in Git.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-secret-builder
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: thanos-secret-builder
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, create, patch, update]
  - apiGroups: [objectbucket.io]
    resources: [objectbucketclaims]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: thanos-secret-builder
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: thanos-secret-builder
subjects:
  - kind: ServiceAccount
    name: thanos-secret-builder
    namespace: open-cluster-management-observability
---
apiVersion: batch/v1
kind: Job
metadata:
  name: thanos-secret-builder
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: thanos-secret-builder
      restartPolicy: OnFailure
      containers:
        - name: build
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command: ["/bin/bash", "-ec"]
          args:
            - |
              oc wait obc/thanos-bucket --for=jsonpath='{.status.phase}'=Bound --timeout=600s
              BUCKET=$(oc get cm thanos-bucket -o jsonpath='{.data.BUCKET_NAME}')
              HOST=$(oc get cm thanos-bucket -o jsonpath='{.data.BUCKET_HOST}')
              PORT=$(oc get cm thanos-bucket -o jsonpath='{.data.BUCKET_PORT}')
              AK=$(oc get secret thanos-bucket -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
              SK=$(oc get secret thanos-bucket -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
              cat <<YAML | oc apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: thanos-object-storage
              type: Opaque
              stringData:
                thanos.yaml: |
                  type: s3
                  config:
                    bucket: $BUCKET
                    endpoint: $HOST:$PORT
                    insecure: false
                    access_key: $AK
                    secret_key: $SK
                    http_config:
                      insecure_skip_verify: true
              YAML
